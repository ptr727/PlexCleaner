# Linter-only configuration for the RegressionTests Python utilities.
#
# The scripts are stdlib-only, so this file carries only the ruff and mypy config.
# README.md "Python tooling" gives the commands, which run the latest tools as the VS Code tasks and CI do.

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]  # import sorting (isort)

[tool.mypy]
files = ["."]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
