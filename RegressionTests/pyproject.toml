# Linter-only configuration for the RegressionTests Python utilities.
#
# These are standalone stdlib-only scripts (no runtime dependencies), so this file carries no
# project/build metadata - only the ruff + mypy config. Run the tools with uv (no install needed):
#
#   uvx ruff check .
#   uvx ruff format --check .
#   uvx mypy .
#
# These run the latest tools, matching the VSCode tasks.
# CI runs the same latest tools through the hub's reusable validator.

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]  # import sorting (isort)

[tool.mypy]
files = ["."]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
