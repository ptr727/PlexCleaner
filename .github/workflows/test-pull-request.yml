name: Test pull request action

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN gets no scope by default, and each job below grants only what its task reads with.
permissions: {}

jobs:

  # The repo builds one combined release target, executable plus Docker image, so one entry lists its paths (D1.1).
  changes:
    name: Detect changed targets job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      # A workflow_dispatch run has no pull request to query, so the filter diffs locally and needs the history.
      - name: Checkout code step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Filter changed paths step
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            release:
              - 'PlexCleaner/**'
              - 'PlexCleanerTests/**'
              - 'Plugins/**'
              - 'Samples/**'
              - 'Docker/Dockerfile'
              - 'Docker/*.sh'
              - '.dockerignore'
              - '.editorconfig'
              - '.config/dotnet-tools.json'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'version.json'

  validate:
    name: Validate sources job
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@77d7ca35011a92edb39d403f961040df3e7dd411 # 2.0.1251
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      python-directories: |
        RegressionTests

  # Never publishes and never uploads (D1.3), since smoke: true disables every publish path in build-release-task.
  # The Docker Hub secrets are mapped even on smoke, since the hub task logs in to Docker Hub on every build for the higher rate limit.
  smoke-build:
    name: Smoke build job
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true'
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@77d7ca35011a92edb39d403f961040df3e7dd411 # 2.0.1251
    permissions:
      contents: read
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      smoke: true
      github: false
      dockerhub: false
      enable_docker: true
      enable_dotnet_publish: true
      enable_nuget: false
      enable_pypi: false
      docker_image: ptr727/plexcleaner
      dotnet_publish_project: ./PlexCleaner/PlexCleaner.csproj
      # On a pull_request event github.ref_name is the PR ref, so the logical branch reads base_ref first.
      branch: ${{ github.base_ref || github.ref_name }}

  # Single required status check, its name bound to the ruleset context (D1.5).
  # A skipped smoke-build, an unchanged target, passes, and a failure or cancellation blocks.
  check-workflow-status:
    name: Check pull request workflow status job
    runs-on: ubuntu-latest
    needs: [changes, validate, smoke-build]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          for result in "changes:${{ needs.changes.result }}" "validate:${{ needs.validate.result }}"; do
            name="${result%%:*}"
            value="${result#*:}"
            if [[ "$value" != "success" ]]; then
              echo "::error::Job '$name' did not succeed ($value)."
              exit 1
            fi
          done
          if [[ "${{ needs.smoke-build.result }}" != "success" && "${{ needs.smoke-build.result }}" != "skipped" ]]; then
            echo "::error::Job 'smoke-build' did not succeed (${{ needs.smoke-build.result }})."
            exit 1
          fi
