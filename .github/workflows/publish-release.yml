name: Publish project release action

# Scheduled + on-demand publisher, one run = one branch (the trigger ref). The weekly schedule rebuilds
# `main` only (native binaries + multi-arch Docker image + GitHub release; refreshes the `latest` image and
# its `ubuntu:rolling` base for CVEs). A manual dispatch publishes the branch it is started from (main =>
# stable/`latest`, develop => prerelease/`develop`). Building only the trigger branch keeps github.ref aligned
# with the branch being versioned, so NBGV classifies it correctly with no matrix and no cross-branch ref leak.
#
# Merges do NOT publish: accumulated changes (mostly Dependabot bumps) ship in the next scheduled run.
# To release develop, dispatch this workflow from the develop branch.
# CI validation runs separately on each pull request (test-pull-request), and this never runs on push.
#
# The release-gate decision, the build/version/publish job graph, the Docker core, and the Docker Hub
# overview are hub-hosted reusable tasks, per docs/reusable-workflows.md "Adopting the Release Chain". The
# trigger policy below stays this repo's own.
on:
  workflow_dispatch:
  schedule:
    # Weekly rebuild/publish of main (Mon 02:00 UTC) to pick up base-image updates.
    - cron: '0 2 * * MON'

# GOVERNANCE.md "Workflow YAML Conventions" Concurrency exception (2).
# There is no push trigger and the schedule publishes, so no run appends the run_id suffix D7.1 describes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# GITHUB_TOKEN gets no scope by default, and each job below grants only what its task writes with.
permissions: {}

jobs:

  # Single source of the release-gate decision (publish or not, stable or not), reused by every job below.
  # Only the long-lived branches publish; a dispatch from any other branch fails here with an ::error::
  # rather than resolving publish == false, so a mistyped release attempt is visible instead of a silent no-op.
  plan:
    name: Plan release job
    uses: ptr727/ProjectTemplate/.github/workflows/publish-plan-task.yml@77d7ca35011a92edb39d403f961040df3e7dd411 # 2.0.1251
    with:
      event_name: ${{ github.event_name }}
      actor: ${{ github.actor }}
      ref_name: ${{ github.ref_name }}

  # The same reusable gate the PR runs, on the branch tip, running only when a publish will happen.
  validate:
    name: Validate job
    needs: [plan]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@77d7ca35011a92edb39d403f961040df3e7dd411 # 2.0.1251
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      python-directories: |
        RegressionTests

  # Build, version, and publish the triggering branch: the multi-runtime PlexCleaner.7z and the multi-arch
  # Docker image, then the GitHub release. Grants the write scopes the hub task needs, since it declares none
  # of its own: contents: write for the release, and actions: write to delete the consumed release-asset-*
  # transfer artifacts.
  publish:
    name: Publish project release job
    needs: [plan, validate]
    if: >-
      ${{ needs.plan.outputs.publish == 'true' && needs.validate.result == 'success' }}
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@77d7ca35011a92edb39d403f961040df3e7dd411 # 2.0.1251
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    permissions:
      contents: write
      actions: write
    with:
      # Pin the exact dispatch/schedule-time commit: a push landing mid-run must not be released unvalidated.
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      smoke: false
      github: true
      dockerhub: true
      enable_docker: true
      enable_dotnet_publish: true
      enable_nuget: false
      enable_pypi: false
      docker_image: ptr727/plexcleaner
      dotnet_publish_project: ./PlexCleaner/PlexCleaner.csproj

  # The Docker Hub overview, published once per release rather than once per image build, which is why it is
  # its own job here rather than a step inside the Docker build. The task gates itself on branch == main, so a
  # develop publish is a harmless no-op.
  publish-docker-readme:
    name: Publish Docker Hub readme job
    needs: [plan, publish]
    if: >-
      ${{ needs.plan.outputs.publish == 'true' && needs.publish.result == 'success' }}
    permissions:
      contents: read
    uses: ptr727/ProjectTemplate/.github/workflows/publish-docker-readme-task.yml@77d7ca35011a92edb39d403f961040df3e7dd411 # 2.0.1251
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      repositories: '["ptr727/plexcleaner"]'
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
